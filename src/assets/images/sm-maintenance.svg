<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" role="img" aria-label="Running hours and a service reminder">
  <rect width="520" height="360" rx="22" fill="#e3f0e5"/>
  <g font-family="Arial,Helvetica,sans-serif">
    
    <!-- clock -->
    <circle cx="140" cy="170" r="84" fill="#fff" stroke="#cfd8d1" stroke-width="3"/>
    <circle cx="140" cy="170" r="68" fill="none" stroke="#e7f1ea" stroke-width="14"/>
    <path d="M140 102 A68 68 0 1 1 78 140" fill="none" stroke="#2f8a4c" stroke-width="14" stroke-linecap="round"/>
    <path d="M140 170 V124 M140 170 L172 188" stroke="#222" stroke-width="5" stroke-linecap="round"/><circle cx="140" cy="170" r="7" fill="#222"/>
    
    
    <!-- service card -->
    <rect x="262" y="84" width="234" height="196" rx="16" fill="#fff" stroke="#cfd8d1" stroke-width="2"/>
    
    <rect x="280" y="128" width="198" height="14" rx="7" fill="#e6ebe7"/><rect x="280" y="128" width="158" height="14" rx="7" fill="#e0a824"/>
    
    <g font-size="13" fill="#222">
      <rect x="280" y="184" width="16" height="16" rx="3" fill="#2f8a4c"/><path d="M284 192 l3 3 l6 -7" stroke="#fff" stroke-width="2.5" fill="none"/>
      <rect x="280" y="210" width="16" height="16" rx="3" fill="#2f8a4c"/><path d="M284 218 l3 3 l6 -7" stroke="#fff" stroke-width="2.5" fill="none"/>
      <rect x="280" y="236" width="16" height="16" rx="3" fill="#fff" stroke="#bdb59f" stroke-width="2"/>
    </g>
    <!-- wrench -->
    <g transform="translate(446 60) rotate(40)"><rect x="-5" y="0" width="10" height="64" rx="5" fill="#7a3b12"/><circle cx="0" cy="0" r="14" fill="#7a3b12"/><rect x="-6" y="-18" width="12" height="16" fill="#e3f0e5"/></g>
  </g>
</svg>
