<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-label="A rice mill with a live monitoring dashboard">
  <rect width="640" height="440" rx="28" fill="#f4efe2"/>
  <circle cx="500" cy="90" r="150" fill="#e7f1ea"/>
  <ellipse cx="320" cy="396" rx="290" ry="26" fill="#dfe9dc"/>
  <!-- mill -->
  <g>
    <rect x="70" y="190" width="30" height="190" fill="#7a3b12"/>
    <rect x="62" y="176" width="46" height="20" rx="4" fill="#5e2c0c"/>
    <rect x="74" y="215" width="8" height="8" fill="#f4efe2"/><rect x="74" y="245" width="8" height="8" fill="#f4efe2"/>
    <path d="M110 280 L230 214 L350 280 Z" fill="#5e2c0c"/>
    <rect x="124" y="280" width="212" height="100" fill="#7a3b12"/>
    <rect x="150" y="304" width="40" height="40" rx="3" fill="#f4efe2"/>
    <path d="M170 304v40M150 324h40" stroke="#7a3b12" stroke-width="3"/>
    <rect x="262" y="318" width="50" height="62" rx="3" fill="#5e2c0c"/>
  </g>
  <!-- rice sack and pile -->
  <path d="M338 366 C330 330 344 312 372 312 C400 312 414 330 406 366 Z" fill="#c8924a"/>
  <ellipse cx="372" cy="313" rx="30" ry="8" fill="#f8f4e8"/>
  <path d="M86 380 C130 340 190 350 226 380 Z" fill="#fbf8ee" stroke="#e6dfc8" stroke-width="2"/>
  <!-- wheat -->
  <g stroke="#2f8a4c" stroke-width="4" fill="none" stroke-linecap="round"><path d="M40 392 C34 330 42 270 70 210"/></g>
  <g fill="#e0a824">
    <ellipse cx="66" cy="214" rx="7" ry="15" transform="rotate(25 66 214)"/><ellipse cx="82" cy="236" rx="7" ry="15" transform="rotate(35 82 236)"/>
    <ellipse cx="50" cy="238" rx="7" ry="15" transform="rotate(-20 50 238)"/><ellipse cx="62" cy="262" rx="7" ry="15" transform="rotate(-15 62 262)"/>
    <ellipse cx="46" cy="284" rx="7" ry="15" transform="rotate(-18 46 284)"/>
  </g>
  <!-- dashboard card -->
  <g transform="translate(300 40)">
    <rect x="0" y="0" width="300" height="214" rx="18" fill="#ffffff" stroke="#cfd8d1" stroke-width="2"/>
    <rect x="0" y="0" width="300" height="38" rx="18" fill="#1f6b3a"/><rect x="0" y="20" width="300" height="18" fill="#1f6b3a"/>
    <text x="18" y="25" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#fff">Live dashboard</text>
    <circle cx="268" cy="19" r="6" fill="#7be08f"/>
    <text x="18" y="70" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#555">Sheller 1</text>
    <rect x="96" y="58" width="150" height="12" rx="6" fill="#e7f1ea"/><rect x="96" y="58" width="108" height="12" rx="6" fill="#2f8a4c"/>
    <text x="254" y="69" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#222">72%</text>
    <text x="18" y="98" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#555">Whitener</text>
    <rect x="96" y="86" width="150" height="12" rx="6" fill="#e7f1ea"/><rect x="96" y="86" width="126" height="12" rx="6" fill="#2f8a4c"/>
    <text x="254" y="97" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#222">84%</text>
    <text x="18" y="126" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#555">Polisher</text>
    <rect x="96" y="114" width="150" height="12" rx="6" fill="#e7f1ea"/><rect x="96" y="114" width="52" height="12" rx="6" fill="#e0a824"/>
    <text x="254" y="125" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#222">35%</text>
    <line x1="18" y1="142" x2="282" y2="142" stroke="#e6ebe7"/>
    <text x="18" y="166" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#555">Power factor</text>
    <text x="18" y="192" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#1f6b3a">0.93</text>
    <text x="160" y="166" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#555">Energy today</text>
    <text x="160" y="192" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#7a3b12">412 kWh</text>
  </g>
</svg>
