<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" role="img" aria-label="Machine load and utilisation">
  <rect width="520" height="360" rx="22" fill="#f4efe2"/>
  <g font-family="Arial,Helvetica,sans-serif">
    <text x="24" y="38" font-size="16" font-weight="700" fill="#1f6b3a">How hard each machine is working</text>
    <g font-size="13" fill="#222">
      <text x="24" y="92">Sheller</text><rect x="120" y="76" width="300" height="20" rx="10" fill="#e6ebe7"/><rect x="120" y="76" width="216" height="20" rx="10" fill="#2f8a4c"/><text x="432" y="92" font-weight="700">72%</text>
      <text x="24" y="142">Whitener</text><rect x="120" y="126" width="300" height="20" rx="10" fill="#e6ebe7"/><rect x="120" y="126" width="276" height="20" rx="10" fill="#d64545"/><text x="432" y="142" font-weight="700">92%</text>
      <text x="24" y="192">Polisher</text><rect x="120" y="176" width="300" height="20" rx="10" fill="#e6ebe7"/><rect x="120" y="176" width="96" height="20" rx="10" fill="#e0a824"/><text x="432" y="192" font-weight="700">32%</text>
      <text x="24" y="242">Sortex</text><rect x="120" y="226" width="300" height="20" rx="10" fill="#e6ebe7"/><text x="432" y="242" font-weight="700" fill="#777">Off</text>
    </g>
    <g font-size="12" fill="#555">
      <rect x="24" y="290" width="14" height="14" rx="3" fill="#2f8a4c"/><text x="44" y="302">Healthy load</text>
      <rect x="148" y="290" width="14" height="14" rx="3" fill="#e0a824"/><text x="168" y="302">Under-used</text>
      <rect x="258" y="290" width="14" height="14" rx="3" fill="#d64545"/><text x="278" y="302">Overloaded</text>
      <rect x="370" y="290" width="14" height="14" rx="3" fill="#e6ebe7" stroke="#bdb59f"/><text x="390" y="302">Not running</text>
    </g>
    <text x="24" y="336" font-size="12" fill="#555">Load = power drawn compared with the motor’s rating.</text>
  </g>
</svg>
