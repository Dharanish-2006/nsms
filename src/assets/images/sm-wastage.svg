<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="Before: one electricity bill. After: a machine-wise breakdown that shows wastage">
  <rect width="800" height="340" rx="22" fill="#f4efe2"/>
  <g font-family="Arial,Helvetica,sans-serif">
    <!-- before -->
    <text x="190" y="40" text-anchor="middle" font-size="16" font-weight="700" fill="#7a3b12">Without monitoring</text>
    <rect x="70" y="62" width="240" height="200" rx="16" fill="#fff" stroke="#cfd8d1" stroke-width="2"/>
    <text x="190" y="104" text-anchor="middle" font-size="13" fill="#555">Monthly electricity bill</text>
    <text x="190" y="156" text-anchor="middle" font-size="40" font-weight="700" fill="#222">₹ 1,86,000</text>
    <circle cx="190" cy="204" r="26" fill="#f4efe2" stroke="#bdb59f" stroke-width="2"/><text x="190" y="215" text-anchor="middle" font-size="32" font-weight="700" fill="#7a3b12">?</text>
    <text x="190" y="290" text-anchor="middle" font-size="13" fill="#555">Which machine used how much?</text>
    <!-- arrow -->
    <path d="M338 160 H430" stroke="#1f6b3a" stroke-width="5" stroke-linecap="round"/><path d="M420 146 L438 160 L420 174" stroke="#1f6b3a" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- after -->
    <text x="610" y="40" text-anchor="middle" font-size="16" font-weight="700" fill="#1f6b3a">With Smart Milling</text>
    <rect x="460" y="62" width="300" height="200" rx="16" fill="#fff" stroke="#1f6b3a" stroke-width="3"/>
    <g font-size="12" fill="#222">
      <text x="476" y="92">Sheller</text><rect x="548" y="80" width="150" height="14" rx="7" fill="#e6ebe7"/><rect x="548" y="80" width="114" height="14" rx="7" fill="#2f8a4c"/><text x="706" y="92" font-weight="700">38%</text>
      <text x="476" y="122">Whitener</text><rect x="548" y="110" width="150" height="14" rx="7" fill="#e6ebe7"/><rect x="548" y="110" width="84" height="14" rx="7" fill="#2f8a4c"/><text x="706" y="122" font-weight="700">28%</text>
      <text x="476" y="152">Polisher</text><rect x="548" y="140" width="150" height="14" rx="7" fill="#e6ebe7"/><rect x="548" y="140" width="60" height="14" rx="7" fill="#e0a824"/><text x="706" y="152" font-weight="700">20%</text>
      <text x="476" y="182">Idle running</text><rect x="548" y="170" width="150" height="14" rx="7" fill="#e6ebe7"/><rect x="548" y="170" width="42" height="14" rx="7" fill="#d64545"/><text x="706" y="182" font-weight="700">14%</text>
    </g>
    <rect x="476" y="204" width="268" height="40" rx="10" fill="#fdecec"/>
    <text x="610" y="229" text-anchor="middle" font-size="13" font-weight="700" fill="#b03030">Wastage found: motors running idle</text>
    <text x="610" y="290" text-anchor="middle" font-size="13" fill="#555">See exactly where every unit goes</text>
    <text x="400" y="326" text-anchor="middle" font-size="11" fill="#777">Illustration with sample figures</text>
  </g>
</svg>
