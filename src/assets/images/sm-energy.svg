<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" role="img" aria-label="Machine-wise energy use and power factor">
  <rect width="520" height="360" rx="22" fill="#f4efe2"/>
  <g font-family="Arial,Helvetica,sans-serif">
    <text x="24" y="38" font-size="16" font-weight="700" fill="#1f6b3a">Energy used today, by machine</text>
    <line x1="40" y1="290" x2="320" y2="290" stroke="#bdb59f" stroke-width="2"/>
    <g text-anchor="middle" font-size="12" fill="#555">
      <rect x="56" y="112" width="44" height="178" rx="5" fill="#2f8a4c"/><text x="78" y="104" font-weight="700" fill="#222">148</text><text x="78" y="310">Sheller</text>
      <rect x="126" y="156" width="44" height="134" rx="5" fill="#2f8a4c"/><text x="148" y="148" font-weight="700" fill="#222">112</text><text x="148" y="310">Whitener</text>
      <rect x="196" y="196" width="44" height="94" rx="5" fill="#e0a824"/><text x="218" y="188" font-weight="700" fill="#222">78</text><text x="218" y="310">Polisher</text>
      <rect x="266" y="235" width="44" height="55" rx="5" fill="#7a3b12"/><text x="288" y="227" font-weight="700" fill="#222">46</text><text x="288" y="310">Sortex</text>
    </g>
    <text x="24" y="338" font-size="12" fill="#555">kWh (units) per machine</text>
    <!-- gauge -->
    <g transform="translate(420 190)">
      <rect x="-86" y="-120" width="172" height="240" rx="16" fill="#fff" stroke="#cfd8d1" stroke-width="2"/>
      <text x="0" y="-92" text-anchor="middle" font-size="14" font-weight="700" fill="#222">Power factor</text>
      <path d="M-58 20 A58 58 0 0 1 58 20" stroke="#e6ebe7" stroke-width="16" fill="none" stroke-linecap="round"/>
      <path d="M-58 20 A58 58 0 0 1 -18 -34" stroke="#d64545" stroke-width="16" fill="none" stroke-linecap="round"/>
      <path d="M-18 -34 A58 58 0 0 1 32 -48" stroke="#e0a824" stroke-width="16" fill="none"/>
      <path d="M32 -48 A58 58 0 0 1 58 20" stroke="#2f8a4c" stroke-width="16" fill="none" stroke-linecap="round"/>
      <line x1="0" y1="20" x2="30" y2="-30" stroke="#222" stroke-width="4" stroke-linecap="round"/><circle cx="0" cy="20" r="7" fill="#222"/>
      <text x="0" y="62" text-anchor="middle" font-size="28" font-weight="700" fill="#1f6b3a">0.93</text>
      <text x="0" y="86" text-anchor="middle" font-size="12" fill="#555">Good: above 0.90</text>
      <text x="0" y="104" text-anchor="middle" font-size="11" fill="#555">Low value = wasted power</text>
    </g>
  </g>
</svg>
