<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" role="img" aria-label="Energy meters send readings through a gateway and the cloud to your dashboard">
  <defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1f6b3a"/></marker></defs>
  <g font-family="Arial,Helvetica,sans-serif" text-anchor="middle">
    <!-- 1 meters -->
    <circle cx="125" cy="92" r="26" fill="#1f6b3a"/><text x="125" y="99" font-size="22" font-weight="700" fill="#fff">1</text>
    <rect x="70" y="128" width="110" height="64" rx="10" fill="#fff" stroke="#cfd8d1" stroke-width="2"/>
    <rect x="82" y="140" width="50" height="22" rx="4" fill="#e7f1ea"/><text x="107" y="156" font-size="12" font-weight="700" fill="#1f6b3a">26.1 kW</text>
    <circle cx="150" cy="151" r="5" fill="#7be08f"/><rect x="82" y="170" width="86" height="8" rx="4" fill="#e6ebe7"/>
    <text x="125" y="218" font-size="15" font-weight="700" fill="#222">Energy meters</text><text x="125" y="238" font-size="12" fill="#555">one on each machine</text>
    <!-- 2 gateway -->
    <circle cx="375" cy="92" r="26" fill="#1f6b3a"/><text x="375" y="99" font-size="22" font-weight="700" fill="#fff">2</text>
    <rect x="320" y="128" width="110" height="64" rx="10" fill="#fff" stroke="#cfd8d1" stroke-width="2"/>
    <rect x="334" y="146" width="82" height="28" rx="5" fill="#7a3b12"/>
    <circle cx="348" cy="160" r="4" fill="#7be08f"/><circle cx="362" cy="160" r="4" fill="#e0a824"/><circle cx="376" cy="160" r="4" fill="#7be08f"/>
    <path d="M394 136 q10 -12 22 0 M399 142 q5 -6 12 0" stroke="#1f6b3a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="375" y="218" font-size="15" font-weight="700" fill="#222">Gateway</text><text x="375" y="238" font-size="12" fill="#555">reads the meters</text>
    <!-- 3 cloud -->
    <circle cx="625" cy="92" r="26" fill="#1f6b3a"/><text x="625" y="99" font-size="22" font-weight="700" fill="#fff">3</text>
    <path d="M590 178 a22 22 0 0 1 4 -43 a30 30 0 0 1 56 -6 a26 26 0 0 1 8 49 Z" fill="#e7f1ea" stroke="#1f6b3a" stroke-width="3" stroke-linejoin="round"/>
    <rect x="613" y="150" width="24" height="18" rx="3" fill="#1f6b3a"/><path d="M618 150 v-6 a7 7 0 0 1 14 0 v6" stroke="#1f6b3a" stroke-width="3" fill="none"/>
    <text x="625" y="218" font-size="15" font-weight="700" fill="#222">Secure cloud</text><text x="625" y="238" font-size="12" fill="#555">stores every reading</text>
    <!-- 4 dashboard -->
    <circle cx="875" cy="92" r="26" fill="#1f6b3a"/><text x="875" y="99" font-size="22" font-weight="700" fill="#fff">4</text>
    <rect x="815" y="128" width="120" height="68" rx="8" fill="#fff" stroke="#1f6b3a" stroke-width="3"/>
    <rect x="828" y="170" width="12" height="14" fill="#2f8a4c"/><rect x="846" y="156" width="12" height="28" fill="#2f8a4c"/><rect x="864" y="146" width="12" height="38" fill="#e0a824"/><rect x="882" y="162" width="12" height="22" fill="#2f8a4c"/><rect x="900" y="140" width="12" height="44" fill="#7a3b12"/>
    <text x="875" y="218" font-size="15" font-weight="700" fill="#222">Your dashboard</text><text x="875" y="238" font-size="12" fill="#555">phone or computer</text>
  </g>
  <g stroke="#1f6b3a" stroke-width="3" marker-end="url(#ar)" fill="none" stroke-linecap="round">
    <path d="M196 160 H300"/><path d="M446 160 H570"/><path d="M692 160 H796"/>
  </g>
</svg>
